name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}${{ matrix.oracle && ' + cryptography oracle' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            oracle: false
          - python: "3.13"
            oracle: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the independent oracle
        if: matrix.oracle
        run: pip install cryptography
      - name: Fixtures are what the reference generates
        run: |
          python3 python/gen_fixture.py --check
          python3 python/gen_core_fixtures.py --check
      - name: Unit tests
        env:
          LXPT_CROSSCHECK_OUT: ${{ github.workspace }}/py.txt
        run: python3 -m unittest discover -s python/tests -t python -v
      - uses: actions/upload-artifact@v4
        if: matrix.oracle
        with:
          name: crosscheck-python
          path: py.txt
          retention-days: 1

  simulator:
    name: T2 simulator gate (3 relays, 8 phones, loss, partitions, stalls)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Every invariant over 20 seeded runs, and the settled share by RTT
        run: python3 python/sim.py --json sim.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-gate
          path: sim.json
          retention-days: 3

  cpp:
    name: C++ (${{ matrix.cxx }}, C++11 and C++17, ASan+UBSan, 10^5 fuzz, cores)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        working-directory: cpp
        run: make test CXX=${{ matrix.cxx }} FUZZ=100000 CROSSCHECK=${{ github.workspace }}/cpp.txt
      - uses: actions/upload-artifact@v4
        if: matrix.cxx == 'g++'
        with:
          name: crosscheck-cpp
          path: cpp.txt
          retention-days: 1

  kotlin:
    name: Kotlin (JVM 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and publish to the local Maven repository (what JitPack runs)
        working-directory: kotlin
        env:
          LXPT_CROSSCHECK_OUT: ${{ github.workspace }}/kt.txt
        run: ./gradlew test publishToMavenLocal --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: crosscheck-kotlin
          path: kt.txt
          retention-days: 1

  crosscheck:
    name: Identical across Python, Kotlin and C++ (wire, floor, relay)
    needs: [python, cpp, kotlin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: crosscheck-*
          merge-multiple: true
      - run: python3 tools/crosscheck.py fixtures/lxpt_wire_v1.json py.txt kt.txt cpp.txt
